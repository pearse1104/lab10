name: HTML CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - '**.html' # Only triggers if an HTML file is added or modified
  pull_request:
    branches: [ main ]
    paths:
      - '**.html'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  ci-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate HTML syntax
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: .

  cd-deploy:
    needs: ci-html
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

